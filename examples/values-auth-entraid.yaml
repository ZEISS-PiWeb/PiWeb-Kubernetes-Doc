serverConfig:
  authentication:
    userAdministration: builtIn
    authentication: oidc
    oidc:
      # clientId values can be overwritten. For example, if they are automatically generated by EntraID
      #clientId: "<entra_client_id>"
      #browserClientId: "<entra_client_id>"
      #browserCompatibilityClientId: "<entra_client_id>"
      externalAuthority: "https://login.microsoftonline.com/<tenantId>/v2.0/"
      # See also https://learn.microsoft.com/en-us/microsoft-365/enterprise/urls-and-ip-address-ranges?view=o365-worldwide#microsoft-365-common-and-office-online
      externalAuthorityCidr: "<ip_address_of_login.microsoftonline.com>/32"
      externalAuthorityPort: 443
      validExternalTokenIssuer: https://sts.windows.net/<tenantId>/
      validAudiences: "api://<piweb_clientId>;api://<piweb_browserClientId>;api://<piweb_browserCompatibilityClientId>"
      requestedScopes: "openid profile email offline_access api://<piweb_clientId>/piweb api://<piweb_browserClientId>/piweb api://<piweb_browserCompatibilityClientId>/piweb"
      additionalEndpointBaseAddresses: https://login.microsoftonline.com/<tenantId>/;https://graph.microsoft.com
keycloak:
  enabled: false
