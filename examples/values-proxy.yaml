serverConfig:
  advanced:
    outboundProxy:
      enabled: true
      httpProxy: "http://proxy.example.com:8080"
      httpsProxy: "https://proxy.example.com:8080"
      noProxy: "localhost,127.0.0.1,.svc,.svc.cluster.local,kubernetes.default.svc"
      cidr: "<ip_address_of_proxy.example.com>"
      port: 8080
